services:
    ms-nestjs-items-microservice:
        image: ${REGISTRY}/items/${BRANCH}:latest
        container_name: ms-nestjs-items
        env_file:
            - ${ENV_FILE}
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'kill -0 1 || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 120s
        labels:
            - autoheal=true
        networks:
            net: {}
networks:
    net:
        external: true
        name: $PROJECT_NET
