services:
    redis:
        image: redis:alpine
        ulimits:
            memlock: -1
        container_name: redis
        command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD --port $$REDIS_PORT"
        env_file:
            - ${ENV_FILE}
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -p "$$REDIS_PORT" -a "$$REDIS_PASSWORD" ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - ~/docker/$COMPOSE_PROJECT_NAME/redis-data:/data
        networks:
            net: {}
        ports:
            - ${REDIS_PORT}:${REDIS_PORT}

networks:
    net:
        external: true
        name: $PROJECT_NET

volumes:
    redis-data:
        name: $PROJECT_NET-redis-data
        driver: local
